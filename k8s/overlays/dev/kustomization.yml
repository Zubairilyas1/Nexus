apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: dev-
namespace: nexusvision-dev

patches:
  - target:
      kind: Deployment
      name: nexus-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 250m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
  - target:
      kind: Deployment
      name: nexus-web
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: nexus-api-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: Ingress
      name: nexus-ingress
    patch: |
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - app.nexusvision.dev
          - api.nexusvision.dev
      - op: replace
        path: /spec/tls/0/secretName
        value: nexus-dev-tls
      - op: replace
        path: /spec/rules/0/host
        value: app.nexusvision.dev
      - op: replace
        path: /spec/rules/1/host
        value: api.nexusvision.dev

configMapGenerator:
  - name: nexus-config
    behavior: merge
    literals:
      - ENVIRONMENT=development
      - DEBUG=true

secretGenerator:
  - name: nexus-secrets
    behavior: merge
    literals:
      - POSTGRES_PASSWORD=devpassword123
      - JWT_SECRET_KEY=dev-secret-key-not-for-production-use
