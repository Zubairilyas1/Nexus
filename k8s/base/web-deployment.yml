apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-web
  namespace: nexusvision
  labels:
    app: nexus-web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nexus-web
        tier: frontend
    spec:
      containers:
        - name: web
          image: ghcr.io/nexusvision/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.nexusvision.local"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://api.nexusvision.local"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
