# Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires: .env file with production secrets
services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: nexus-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-nexusvision}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    networks:
      - nexus-internal

  redis:
    image: redis:7-alpine
    container_name: nexus-cache
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - nexus-internal

  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-nexusvision}/backend:latest
    container_name: nexus-api
    restart: always
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexusvision}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY required}
      ENVIRONMENT: production
      DEBUG: "false"
      WORKERS: ${API_WORKERS:-2}
      RTSP_SOURCE: ${RTSP_SOURCE:-}
      YOUTUBE_FALLBACK_URL: ${YOUTUBE_FALLBACK_URL:-}
    volumes:
      - nexus-models:/app/models:ro
      - nexus-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - nexus-internal

  web:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-nexusvision}/frontend:latest
    container_name: nexus-web
    restart: always
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.nexusvision.local}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.nexusvision.local}
      NODE_ENV: production
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - nexus-internal

  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - web
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - nexus-internal
      - nexus-public

volumes:
  postgres-data:
  redis-data:
  nexus-models:
  nexus-logs:

networks:
  nexus-internal:
    name: nexus-internal
  nexus-public:
    name: nexus-public
